<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Portal - MICHU Flour Mills</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="portal-container">
        <div class="portal-header">
            <a href="index.html" class="logo">
                <div class="logo-symbol"></div>
                <span class="logo-text">MICHU</span>
            </a>
        </div>
        
        <div class="portal-box">
            <h1>Distributor Portal</h1>
            <p class="portal-subtitle">Access your account</p>
            
            <form id="loginForm" class="portal-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                </div>
                
                <button type="submit" class="portal-btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                
                <div id="loginMessage" class="portal-message"></div>
            </form>
            
            <div class="portal-footer">
                <p>Need access? <a href="index.html#contact">Contact us</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="portal-auth.js"></script>
</body>
</html>
