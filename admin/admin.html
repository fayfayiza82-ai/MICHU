<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICHU Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }
        
        .admin-header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .admin-title {
            font-family: var(--font-serif);
            color: var(--color-brown);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .admin-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-beige);
            padding-bottom: 10px;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: var(--color-text-light);
            font-family: var(--font-sans);
            font-size: 1rem;
            cursor: pointer;
            position: relative;
        }
        
        .tab-btn.active {
            color: var(--color-brown);
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--color-brown);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th {
            background-color: var(--color-beige);
            padding: 15px;
            text-align: left;
            font-weight: 500;
            color: var(--color-brown);
            font-family: var(--font-serif);
        }
        
        .admin-table td {
            padding: 15px;
            border-bottom: 1px solid var(--color-beige);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }
        
        .status-pending {
            background-color: #FFF3CD;
            color: #856404;
        }
        
        .status-completed {
            background-color: #D4EDDA;
            color: #155724;
        }
        
        .admin-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: var(--color-white);
            border: 1px solid var(--color-beige);
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        
        .btn-primary {
            background-color: var(--color-brown);
            color: var(--color-white);
        }
        
        .btn-secondary {
            background-color: var(--color-beige);
            color: var(--color-text);
        }
        
        .btn-danger {
            background-color: #DC3545;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background-color: var(--color-white);
            border: 1px solid var(--color-beige);
            text-align: center;
        }
        
        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--color-beige);
            font-family: var(--font-sans);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--color-brown);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <div class="logo-symbol"></div>
                <span class="logo-text">MICHU</span>
            </a>
            <span style="font-size: 0.9rem; color: var(--color-brown);">Admin Panel</span>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">MICHU Admin Dashboard</h1>
            <p>Manage products and customer inquiries</p>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="inquiries">Inquiries</button>
            <button class="tab-btn" data-tab="products">Products</button>
            <button class="tab-btn" data-tab="add-product">Add Product</button>
        </div>

        <div id="inquiries" class="tab-content active">
            <div class="table-container">
                <table class="admin-table" id="inquiriesTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Type</th>
                            <th>Company</th>
                            <th>Country</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 40px;">
                                Loading inquiries...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="table-container">
                <table class="admin-table" id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Weight</th>
                            <th>Order</th>
                            <th>Active</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 40px;">
                                Loading products...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="add-product" class="tab-content">
            <form id="productForm" class="admin-form">
                <div class="form-group">
                    <input type="text" id="productName" class="form-input" placeholder="Product Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="productType" class="form-input" placeholder="Product Type (e.g., Bread Flour)" required>
                </div>
                <div class="form-group">
                    <textarea id="productDescription" class="form-textarea" placeholder="Description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <input type="text" id="productWeight" class="form-input" placeholder="Weight (e.g., 5kg, 10kg)" required>
                </div>
                <div class="form-group">
                    <input type="text" id="productCertification" class="form-input" placeholder="Certification" value="Organic">
                </div>
                <div class="form-group">
                    <input type="text" id="productPackaging" class="form-input" placeholder="Packaging Type" value="Kraft Bag">
                </div>
                <div class="form-group">
                    <input type="number" id="productOrder" class="form-input" placeholder="Order Index" value="1">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="productActive" checked> Active
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Product</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <a href="../index.html" class="back-link">← Back to Main Site</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all tabs
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    // Add active class to clicked tab
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                    
                    // Load data if needed
                    if (btn.dataset.tab === 'inquiries') loadInquiries();
                    if (btn.dataset.tab === 'products') loadProducts();
                });
            });
            
            // Product form submission
            const productForm = document.getElementById('productForm');
            if (productForm) {
                productForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const productData = {
                        name: document.getElementById('productName').value,
                        type: document.getElementById('productType').value,
                        description: document.getElementById('productDescription').value,
                        weight: document.getElementById('productWeight').value,
                        certification: document.getElementById('productCertification').value,
                        packaging: document.getElementById('productPackaging').value,
                        order_index: parseInt(document.getElementById('productOrder').value) || 1,
                        active: document.getElementById('productActive').checked,
                        created_at: new Date().toISOString()
                    };
                    
                    try {
                        const product = await window.productManagement.addProduct(productData);
                        alert('Product added successfully!');
                        productForm.reset();
                        loadProducts(); // Refresh products list
                    } catch (error) {
                        console.error('Error adding product:', error);
                        alert('Error adding product. Please try again.');
                    }
                });
            }
            
            // Load initial data
            loadInquiries();
        });
        
        async function loadInquiries() {
            const tbody = document.querySelector('#inquiriesTable tbody');
            if (!tbody) return;
            
            try {
                const inquiries = await window.productManagement.getAllInquiries();
                
                if (inquiries.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 40px;">
                                No inquiries found.
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = inquiries.map(inquiry => `
                    <tr>
                        <td>${new Date(inquiry.created_at).toLocaleDateString()}</td>
                        <td>${inquiry.name}</td>
                        <td>${inquiry.email}</td>
                        <td>${inquiry.type}</td>
                        <td>${inquiry.company || '-'}</td>
                        <td>${inquiry.country || '-'}</td>
                        <td>${inquiry.message.substring(0, 50)}${inquiry.message.length > 50 ? '...' : ''}</td>
                        <td>
                            <span class="status-badge status-${inquiry.status}">
                                ${inquiry.status}
                            </span>
                        </td>
                        <td>
                            <button onclick="updateInquiryStatus('${inquiry.id}', 'completed')" class="btn btn-primary" style="padding: 5px 10px; font-size: 0.8rem;">
                                Mark Completed
                            </button>
                        </td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('Error loading inquiries:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 40px; color: #DC3545;">
                            Error loading inquiries. Please try again.
                        </td>
                    </tr>
                `;
            }
        }
        
        async function loadProducts() {
            const tbody = document.querySelector('#productsTable tbody');
            if (!tbody) return;
            
            try {
                const products = await window.productManagement.getAllProducts();
                
                if (products.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 40px;">
                                No products found.
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = products.map(product => `
                    <tr>
                        <td>${product.id.substring(0, 8)}...</td>
                        <td>${product.name}</td>
                        <td>${product.type}</td>
                        <td>${product.description.substring(0, 50)}${product.description.length > 50 ? '...' : ''}</td>
                        <td>${product.weight}</td>
                        <td>${product.order_index}</td>
                        <td>${product.active ? 'Yes' : 'No'}</td>
                        <td>
                            <button onclick="editProduct('${product.id}')" class="btn btn-secondary" style="padding: 5px 10px; font-size: 0.8rem; margin-right: 5px;">
                                Edit
                            </button>
                            <button onclick="deleteProduct('${product.id}')" class="btn btn-danger" style="padding: 5px 10px; font-size: 0.8rem;">
                                Delete
                            </button>
                        </td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('Error loading products:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #DC3545;">
                            Error loading products. Please try again.
                        </td>
                    </tr>
                `;
            }
        }
        
        async function updateInquiryStatus(id, status) {
            try {
                await window.productManagement.updateInquiryStatus(id, status);
                loadInquiries(); // Refresh the table
            } catch (error) {
                console.error('Error updating inquiry:', error);
                alert('Error updating inquiry status.');
            }
        }
        
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await window.productManagement.deleteProduct(id);
                loadProducts(); // Refresh the table
            } catch (error) {
                console.error('Error deleting product:', error);
                alert('Error deleting product.');
            }
        }
        
        function editProduct(id) {
            alert('Edit functionality would open a modal to edit product ' + id);
            // In a full implementation, this would open a modal with a pre-filled form
        }
    </script>
</body>
</html>
